[project]
name = "ros2-pi05-compatibility"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vlash==0.1.0",
    "torch==2.7.1+cu126",
    "torchvision==0.22.1+cu126",
    "torchcodec==0.5",
    "transformers==4.53.3",
    "peft==0.18.0",
    "sentencepiece==0.2.1",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "opencv-python==4.11.0.86",
    "mujoco==3.12.0",
    "matplotlib==3.10.7",
    "pillow==12.3.0",
]

[dependency-groups]
validation = ["pytest==8.4.2"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
vlash = { path = "/opt/vlash", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cpu" }
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "dcddb970176382c0fcf4521b0c0e6fc15894dfe0" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
