[supervisord]
nodaemon=true
pidfile=/tmp/desktop-supervisord.pid
logfile=/tmp/desktop-supervisord.log
childlogdir=/tmp
environment=DISPLAY=":1"

[unix_http_server]
file=/tmp/desktop-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/desktop-supervisor.sock

[program:display]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp -ac
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop]
command=/usr/bin/dbus-run-session -- /usr/bin/startxfce4
priority=20
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
command=/usr/bin/x11vnc -display :1 -rfbport 5901 -localhost -forever -shared -nopw -xkb
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
priority=40
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
