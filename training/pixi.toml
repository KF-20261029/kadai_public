[workspace]
name = "so101-pi05-vlash"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.6" }]

[dependencies]
python = "3.10.*"
ffmpeg = "7.1.1.*"

[pypi-dependencies]
vlash = { path = "/opt/vlash", editable = true }
torch = { version = "==2.7.1+cu126", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.22.1+cu126", index = "https://download.pytorch.org/whl/cu126" }
torchcodec = { version = "==0.5", index = "https://download.pytorch.org/whl/cpu" }
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "dcddb970176382c0fcf4521b0c0e6fc15894dfe0" }
peft = "==0.18.0"
sentencepiece = "==0.2.1"
numpy = "==2.2.6"
mujoco = "==3.3.7"
matplotlib = "==3.10.7"
pillow = "==12.3.0"
